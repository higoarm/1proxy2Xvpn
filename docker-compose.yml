# docker-compose.yml — Single container example
# For multiple containers, use ./2-start_containers.sh instead.

services:
  1proxy2xvpn:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: 1proxy2xvpn
    image: 1proxy2xvpn:latest
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "3100:3128"
    volumes:
      - ./ovpns:/ovpn:ro
    working_dir: /ovpn
    command: ["openvpn", "config.ovpn"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "10",
             "-x", "http://localhost:3128", "https://ifconfig.me"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
