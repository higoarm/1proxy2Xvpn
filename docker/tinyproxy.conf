# tinyproxy.conf — Lightweight HTTP proxy, no cache, no IPv6 issues
# Network isolation is handled entirely by iptables (Kill Switch).

Port 3128
Listen 0.0.0.0
Timeout 600
MaxClients 100
MinSpareServers 5
MaxSpareServers 20
StartServers 10

# Accept connections from any source
# (access control is enforced by iptables/Kill Switch)
Allow 0.0.0.0/0

# HTTPS tunneling (CONNECT method)
ConnectPort 443
ConnectPort 563
ConnectPort 8443

# Log to stdout so output appears in "docker logs"
LogFile "/dev/stdout"
LogLevel Info

# Remove proxy identification headers
DisableViaHeader Yes

PidFile "/var/run/tinyproxy/tinyproxy.pid"
