# =============================================================================
# tinyproxy.conf — HTTP proxy (primary protocol)
# Hardened against fingerprinting by security scanners (Nuclei, Shodan, etc.)
#
# NOTE: tinyproxy 1.11+ uses a threading model and no longer supports the
# prefork directives (MinSpareServers, MaxSpareServers, StartServers,
# MaxRequestsPerChild). Concurrency is controlled by MaxClients only.
# =============================================================================

User nobody
Group nogroup
Port 3128
Listen 0.0.0.0
Timeout 600

# Concurrency — sized for high concurrency workloads (Nuclei, ffuf)
MaxClients 500

# Access control — network isolation is enforced by iptables/Kill Switch,
# so we accept from any source at the proxy level.
Allow 0.0.0.0/0

# HTTPS tunneling (CONNECT method)
ConnectPort 443
ConnectPort 563
ConnectPort 8443
ConnectPort 8080
ConnectPort 9443

# Logging — stdout for docker logs / promtail aggregation
LogFile "/dev/stdout"
LogLevel Info

# ── Anti-fingerprint configuration ────────────────────────────────────────────
DisableViaHeader Yes
DefaultErrorFile "/etc/tinyproxy/custom_error.html"
StatHost "stats.disabled.invalid"

# PID file location (writable by the runtime user)
PidFile "/var/run/tinyproxy/tinyproxy.pid"
