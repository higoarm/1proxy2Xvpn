# =============================================================================
# danted.conf — Dante SOCKS5 server (replaces 3proxy)
# Network isolation is enforced by iptables (Kill Switch), so we allow all.
# External interface MUST be tun0 — ensures traffic exits via VPN.
# =============================================================================

logoutput: stderr

# Listen on all interfaces, port 1080
internal: 0.0.0.0 port = 1080

# Force all outbound through VPN tunnel
external: tun0

# No authentication required (Kill Switch handles isolation)
clientmethod: none
socksmethod: none

# Run as unprivileged user after binding
user.privileged: root
user.unprivileged: nobody

# Client connection rules (who can connect to the SOCKS server)
client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: error
}

# SOCKS command rules (what they can do)
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect
    log: error
}
